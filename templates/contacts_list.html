{% extends "base.html" %}
{% block title %}Contacts — ConTexts{% endblock %}
{% block content %}
<h1>Contacts</h1>

<form method="get" class="filter-bar">
    <input type="text" name="q" placeholder="Search name or company" value="{{ q }}">
    <select name="node_id">
        <option value="">Any node</option>
        {% for n in nodes %}
        <option value="{{ n.id }}" {% if node_id == n.id|string %}selected{% endif %}>{{ n.name }}</option>
        {% endfor %}
    </select>
    <button type="submit">Filter</button>
    <a href="{{ url_for('contacts_list') }}">Clear</a>
</form>

<p><a href="{{ url_for('contact_new') }}">+ New contact</a></p>

<table class="data-table">
    <thead><tr><th>Name</th><th>Company</th><th>Title</th></tr></thead>
    <tbody>
        {% for c in contacts %}
        <tr>
            <td><a href="{{ url_for('contact_detail', contact_id=c.id) }}">{{ c.name }}</a></td>
            <td>{{ c.company or '' }}</td>
            <td>{{ c.title or '' }}</td>
        </tr>
        {% else %}
        <tr><td colspan="3" class="muted">No contacts found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
