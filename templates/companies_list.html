{% extends "base.html" %}
{% block title %}Companies — ConTexts{% endblock %}
{% block content %}
<h1>Companies</h1>

<form method="get" class="filter-bar">
    <input type="text" name="q" placeholder="Search name" value="{{ q }}">
    <button type="submit">Filter</button>
    <a href="{{ url_for('companies_list') }}">Clear</a>
</form>

<p><a href="{{ url_for('company_new') }}">+ New company</a></p>

<table class="data-table">
    <thead><tr><th>Name</th><th>Website</th></tr></thead>
    <tbody>
        {% for c in companies %}
        <tr>
            <td><a href="{{ url_for('company_detail', company_id=c.id) }}">{{ c.name }}</a></td>
            <td>{{ c.website or '' }}</td>
        </tr>
        {% else %}
        <tr><td colspan="2" class="muted">No companies found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
